# Deploy with Coolify (Docker Compose build pack) or locally: docker compose up --build
#
# Only `web` is public (assign your domain to it in Coolify, port 3000); it proxies /api/* to `api`.
# Variables to set (Coolify > Environment Variables):
#   OPENAI_API_KEY (+ optional OPENAI_MODEL), or LLM_API_URL / LLM_API_KEY, or OLLAMA_BASE_URL + OLLAMA_MODEL
services:
  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      EXERCISES_DATASET_URL: ${EXERCISES_DATASET_URL:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/}
    volumes:
      - gym_data:/app/data
    expose:
      - "8001"

  web:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"

volumes:
  gym_data:
